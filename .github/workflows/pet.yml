name: Update GitHub pet

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: github-pet
  cancel-in-progress: true

jobs:
  pet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Feed the pet
        env:
          PET_USERNAME: ${{ github.repository_owner }}
          PET_TOKEN: ${{ secrets.PET_TOKEN }}
          PET_NAME: The Knight
        run: |
          if [ -z "$PET_TOKEN" ]; then
            echo "::warning::PET_TOKEN is not set; keeping the current pet. Add a PAT with read:user, then re-run."
            exit 0
          fi
          python3 scripts/pet.py --readme ReadMe.md --out pet.svg

      - name: Commit the new pet
        run: |
          if git diff --quiet --exit-code -- pet.svg ReadMe.md; then
            echo "Pet is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pet.svg ReadMe.md
          git commit -m "chore(pet): daily update"
          git push
